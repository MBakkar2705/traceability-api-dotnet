<text x="20" y="340" font-size="13" font-weight="700" fill="#1f2937">Lecture</text>
<text x="20" y="362" font-size="12.5" fill="#374151">Une ferme produit plusieurs lots. Un lot a plusieurs mouvements (1 = un, N = plusieurs).</text>
<text x="20" y="382" font-size="12.5" fill="#374151">Une station a plusieurs fonctions (une ligne par fonction dans StationCapability). Une fonction d'une station sert à plusieurs mouvements.</text>
<text x="20" y="402" font-size="12.5" fill="#374151">Movement pointe vers StationCapability par deux colonnes (StationId + MovementType, les deux traits) : la base refuse un mouvement dont la station n'a pas cette fonction.</text>
<text x="20" y="422" font-size="12.5" fill="#374151">Movement est un journal : on ajoute des lignes, on ne modifie ni n'efface jamais une ligne.</text>
<text x="20" y="442" font-size="12.5" fill="#374151">Les longueurs de texte sont indicatives, à ajuster avant les scripts SQL. Heures stockées en UTC (DATETIME2).</text>
<text x="20" y="476" font-size="12" font-weight="700" fill="#b45309">PK</text>
<text x="44" y="476" font-size="12" fill="#374151">clé primaire</text>
<text x="148.8" y="476" font-size="12" font-weight="700" fill="#2563eb">FK</text>
<text x="172.8" y="476" font-size="12" fill="#374151">clé étrangère</text>
<text x="284.0" y="476" font-size="12" font-weight="700" fill="#047857">UQ</text>
<text x="308.0" y="476" font-size="12" fill="#374151">valeur unique</text>
<text x="419.2" y="476" font-size="12" font-weight="700" fill="#7c3aed">CK</text>
<text x="443.2" y="476" font-size="12" fill="#374151">règle CHECK (valeurs ou limites imposées)</text>
<text x="20" y="496" font-size="12" fill="#374151">PK et FK sur la même colonne : elle fait partie de la clé primaire et pointe vers une autre table. StationCapability a une clé primaire composée (StationId + MovementType).</text>
</svg>