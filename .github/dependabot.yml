# Lot 15: Dependabot version updates. One pull request per outdated dependency, once a week,
# at most 3 open at a time per block. NuGet, npm, Docker and Compose use a 7-day cooldown
# before a new release is proposed; Dependabot warns it cannot apply it to images from
# mcr.microsoft.com and quay.io. The github-actions block sets no cooldown.
# Nothing is merged automatically: each pull request is read and merged by hand.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
