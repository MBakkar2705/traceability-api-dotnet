name: CI

# Lot 6: continuous integration. Three independent jobs:
#   backend  - builds TraceabilityTest from the SQL scripts in a throwaway SQL Server
#              container (SQL authentication), then runs the C# tests.
#   frontend - lint, build and tests of the web interface.
#   docker   - builds the API image with the Dockerfile (lot 9). Nothing is published, no secret is used.
# The runner is pinned to ubuntu-24.04 instead of ubuntu-latest (see docs/verification.md, section 14).
# The actions are pinned by commit hash (lot 9); the comment after each hash gives the version.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install sqlcmd (mssql-tools18)
        run: |
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          # Later steps find sqlcmd through the PATH, so add its folder to it.
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          ls -l /opt/mssql-tools18/bin/sqlcmd

      - name: Show tool versions
        run: |
          dotnet --version
          sqlcmd -? 2>&1 | head -n 3 || true
          docker image inspect mcr.microsoft.com/mssql/server:2025-latest --format '{{index .RepoDigests 0}}' || true

      - name: Wait for SQL Server (60 s at most)
        env:
          # sqlcmd reads the password from this variable, so it never appears on a command line.
          # Only the steps that call sqlcmd to connect receive it.
          SQLCMDPASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          last_error=""
          for i in $(seq 1 30); do
            if last_error=$(sqlcmd -C -S localhost,1433 -U sa -b -Q "SELECT 1" 2>&1); then
              echo "SQL Server answered after about $((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not answer within 60 s. Last error:"
          echo "$last_error"
          exit 1

      - name: Build TraceabilityTest from the SQL scripts
        env:
          # Same variable as in "Wait for SQL Server": only the steps that call sqlcmd receive it.
          SQLCMDPASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/db"
          for f in 001_create_database 002_create_schema_and_tables 004_create_reference_procedures 005_create_batch_procedures 011_create_list_procedures 017_optimize_list_batches; do
            # Work on a temporary copy: only the :setvar line changes, the repository files do not.
            sed 's/^:setvar DbName .*/:setvar DbName TraceabilityTest/' "database/$f.sql" > "$RUNNER_TEMP/db/$f.sql"
            if ! grep -q '^:setvar DbName TraceabilityTest' "$RUNNER_TEMP/db/$f.sql"; then
              echo "The :setvar DbName line was not replaced in $f.sql"
              exit 1
            fi
            echo "=== $f.sql"
            sqlcmd -C -S localhost,1433 -U sa -b -i "$RUNNER_TEMP/db/$f.sql"
          done

      - name: List what was created (read only)
        env:
          # Same variable as in "Wait for SQL Server": only the steps that call sqlcmd receive it.
          SQLCMDPASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          sqlcmd -C -S localhost,1433 -U sa -b -Q "SELECT @@VERSION AS engine_version, SERVERPROPERTY('ProductVersion') AS product_version"
          sqlcmd -C -S localhost,1433 -U sa -b -d TraceabilityTest -Q "SELECT s.name AS schema_name, p.name AS procedure_name FROM sys.procedures AS p JOIN sys.schemas AS s ON s.schema_id = p.schema_id ORDER BY s.name, p.name"
          sqlcmd -C -S localhost,1433 -U sa -b -d TraceabilityTest -Q "SELECT name FROM sys.indexes WHERE object_id = OBJECT_ID(N'trace.Batch') AND name IS NOT NULL ORDER BY name"

      - name: Build
        run: dotnet build Traceability.slnx

      - name: Test
        env:
          ConnectionStrings__Test: Server=localhost,1433;Database=TraceabilityTest;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True
        run: dotnet test Traceability.slnx --no-build

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Docker version
        run: docker --version

      # Only a build: the image is not started, not pushed to a registry, and no secret is used.
      - name: Build the API image
        run: docker build -t traceability-api .

      - name: Show the image
        run: docker image ls traceability-api
